android.useAndroidX=true
android.enableJetifier=false
kotlin.code.style=official

# Gradle daemon default heap is only 512MB. With Compose + Glance that's too
# tight: the java_pid*.hprof files in the project root are OutOfMemory heap
# dumps (one from 2026-10-11 15:19), and an OOM mid-build is the most likely
# cause of the intermittent ":app:packageDebug FAILED (IncrementalSplitterRunnable)".
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2g
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false
