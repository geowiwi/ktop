name: Android Release

# Push a tag like 0.1.0 (stable) or 0.1.0-preview.1 (pre-release) to build a
# signed APK and publish it as a GitHub release.
on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate tag
        id: tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "${TAG}" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          elif [[ "${TAG}" =~ ^[0-9]+(\.[0-9]+)*-[A-Za-z]+(\.[0-9]+)?$ ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "Invalid tag '${TAG}' - expected e.g. 0.1.0 or 0.1.0-preview.1"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Prepare signing key
        env:
          ANDROID_RELEASE_KEY_BASE64: ${{ secrets.ANDROID_RELEASE_KEY_BASE64 }}
        run: |
          if [ -z "${ANDROID_RELEASE_KEY_BASE64}" ]; then
            echo "Secret ANDROID_RELEASE_KEY_BASE64 is missing"; exit 1
          fi
          echo "${ANDROID_RELEASE_KEY_BASE64}" | base64 -d > "${RUNNER_TEMP}/release.jks"

      - name: Build release APK
        env:
          GITHUB_USER: ${{ secrets.GPR_USER }}
          GITHUB_TOKEN: ${{ secrets.GPR_KEY }}
          RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          # versionCode stays above the last dev build (53)
          VERSION_CODE: ${{ github.run_number }}00
          VERSION_NAME: ${{ github.ref_name }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "ktop-${GITHUB_REF_NAME}.apk"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ktop-${{ github.ref_name }}.apk
          prerelease: ${{ steps.tag.outputs.prerelease }}
          generate_release_notes: true
